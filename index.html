		<style>
			/* Tela de loading fixa sobre tudo */
			#loading-screen {
				position: fixed;
				top: 0; left: 0;
				width: 100vw; height: 100vh;
				background-color: #ff6f00;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 9999;
				color: #FFFFFF;
				font-family: 'Ubuntu', sans-serif;
				user-select: none;
				transition: opacity 0.5s ease;
			}

			#loading-logo {
				font-size: 4rem;
				font-weight: 900;
				letter-spacing: 4px;
				margin-bottom: 1rem;
				animation: pulse 1.8s infinite;
			}

			#loading-text {
				font-size: 1.8rem;
				font-weight: 600;
				letter-spacing: 2px;
				white-space: nowrap;
				border-left: 3px solid #FFFFFF;
				padding-left: 5px;
				animation: glow 1.8s infinite;
				overflow: hidden;
				width: 20ch;
			}

			@keyframes pulse {
				0%, 100% {
					transform: scale(1);
					opacity: 1;
					text-shadow: 0 0 5px #fff;
				}
				50% {
					transform: scale(1.1);
					opacity: 0.7;
					text-shadow: 0 0 20px #fff;
				}
			}

			@keyframes glow {
				0%, 100% {
					opacity: 1;
					text-shadow: 0 0 10px #fff;
				}
				50% {
					opacity: 0.6;
					text-shadow: 0 0 30px #fff;
				}
			}
		</style>

		<div id="loading-screen">
			<div id="loading-logo"> ☀️ </div>
			<div id="loading-text"></div>
		</div>

		<script>
			const texto = "Cantinho-Nordestino.......";
			const loadingText = document.getElementById('loading-text');
			let i = 0;

			function typeWriter() {
				if (i < texto.length) {
					loadingText.textContent += texto.charAt(i);
					i++;
					setTimeout(typeWriter, 150);
				} else {
					setTimeout(() => {
						const loadingScreen = document.getElementById('loading-screen');
						loadingScreen.style.opacity = '0';
						setTimeout(() => {
							loadingScreen.style.display = 'none';
						}, 500);
					}, 1000);
				}
			}

			window.addEventListener('load', () => {
				typeWriter();
			});
		</script>
